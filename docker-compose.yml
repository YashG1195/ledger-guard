version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: ledgerguard-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7.0
    container_name: ledgerguard-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --eval
      - |
        try {
          rs.status();
          console.log("Replica set rs0 already initiated.");
        } catch (e) {
          console.log("Initiating replica set rs0...");
          rs.initiate({
            _id: "rs0",
            members: [
              { _id: 0, host: "mongo:27017" }
            ]
          });
        }

  redis:
    image: redis:7-alpine
    container_name: ledgerguard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongo_data:
  redis_data:
